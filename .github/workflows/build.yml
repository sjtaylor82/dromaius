# Builds the macOS app (universal: Apple Silicon + Intel).
#
# Run it from the Actions tab ("Run workflow") to get a test build as a
# downloadable artifact. Pushing a version tag (v*) also attaches the build to
# that tag's GitHub release.
#
# The signed Android bridge is taken from the latest GitHub release and built
# into the program, so the signing key never has to be stored on GitHub.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust tests
        working-directory: desktop
        run: cargo test

      - name: Page tests
        working-directory: desktop/ui-tests
        run: npm ci && npm test

      - name: Get the signed bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $found = $false
          $tags = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName'
          foreach ($tag in $tags) {
            gh release download $tag --repo "${{ github.repository }}" --pattern dromaius-bridge.apk --dir "$env:RUNNER_TEMP" 2>$null
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
          }
          if (-not $found) { throw "No signed dromaius-bridge.apk was found in any release" }
          "DROMAIUS_EMBED_APK=$env:RUNNER_TEMP\dromaius-bridge.apk" >> $env:GITHUB_ENV

      - name: Build
        working-directory: desktop
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content desktop/tauri.conf.json | ConvertFrom-Json).version
          $folder = "out/Dromaius-$version-windows-x64"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item desktop/target/release/dromaius.exe, dist/README.txt $folder
          # MinGW builds need the dynamic WebView2 loader; MSVC normally links
          # its loader statically. Include the DLL when the toolchain emits it.
          $loader = Get-ChildItem desktop/target/release -Recurse -Filter WebView2Loader.dll | Select-Object -First 1
          if ($loader) { Copy-Item $loader.FullName $folder }
          Compress-Archive -Path $folder -DestinationPath "out/Dromaius-$version-windows-x64.zip"
          $hash = (Get-FileHash "out/Dromaius-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash *Dromaius-$version-windows-x64.zip" | Set-Content out/SHA256SUMS-windows.txt -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dromaius-windows-x64
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" out/* --clobber --repo "${{ github.repository }}"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust tests
        working-directory: desktop
        run: cargo test

      - name: Page tests
        working-directory: desktop/ui-tests
        run: npm ci && npm test

      - name: Get the signed bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=false
          for tag in $(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --repo "${{ github.repository }}" --pattern dromaius-bridge.apk --dir "$RUNNER_TEMP" 2>/dev/null; then
              found=true
              break
            fi
          done
          if [ "$found" != true ]; then echo "No signed dromaius-bridge.apk was found in any release" >&2; exit 1; fi
          echo "DROMAIUS_EMBED_APK=$RUNNER_TEMP/dromaius-bridge.apk" >> "$GITHUB_ENV"

      - name: Build the universal app
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.1 build --target universal-apple-darwin --bundles app

      - name: Package
        run: |
          APP=desktop/target/universal-apple-darwin/release/bundle/macos/Dromaius.app
          codesign --verify --deep --strict "$APP"
          VERSION=$(node -p "require('./desktop/tauri.conf.json').version")
          mkdir -p "out/Dromaius" && cp -R "$APP" out/Dromaius/ && cp dist/README-mac.txt out/Dromaius/README.txt
          cp dist/install-macos.sh dist/collect-macos-logs.sh out/Dromaius/
          chmod +x out/Dromaius/*.sh
          (cd out && ditto -c -k --keepParent Dromaius "Dromaius-$VERSION-macos-universal.zip")
          (cd out && shasum -a 256 "Dromaius-$VERSION-macos-universal.zip" > SHA256SUMS-macos.txt)
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dromaius-macos
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "${{ github.repository }}"
