[package]
name = "dromaius"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
tauri = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = "2"

# Checksumming multi-gigabyte downloads is very slow without optimisation.
[profile.dev.package.sha1_smol]
opt-level = 3
