[package]
name = "dromaius"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
sha2 = "0.10"
tauri = "2"
reqwest = { version = "0.13.5", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-location = "0.3.2"

[build-dependencies]
tauri-build = "2"

# Checksumming multi-gigabyte downloads is very slow without optimisation.
[profile.dev.package.sha1_smol]
opt-level = 3
